name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: Windows, runner: windows-2022}
          - {os: Linux, runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install workflow parser (Windows)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install workflow parser (Linux)
        if: matrix.os == 'Linux'
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run Windows harness
        if: matrix.os == 'Windows'
        shell: pwsh
        run: ./Scripts/Tests/test-windows.ps1
      - name: Run Unix harness
        if: matrix.os == 'Linux'
        run: bash Scripts/Tests/test-unix.sh
      - name: Verify Unix entrypoints are executable
        if: matrix.os == 'Linux'
        run: |
          test -x Scripts/project.sh
          test -z "$(find Scripts/Unix Scripts/Linux Scripts/Mac -name '*.sh' -type f ! -perm -111 -print -quit)"

  windows:
    name: Windows x64 VS2022 ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist, DebugASan]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            Tools/Windows
            Build/Dependencies
          key: windows-${{ runner.arch }}-msc-dependencies-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Windows/dependencies.ps1') }}
      - shell: pwsh
        run: ./Scripts/project.ps1 bootstrap -Generator vs2022 -Architecture x86_64 -Toolset default
      - shell: pwsh
        run: ./Scripts/project.ps1 generate -Generator vs2022 -Architecture x86_64 -Toolset default -CI
      - shell: pwsh
        run: ./Scripts/project.ps1 test -Generator vs2022 -Configuration ${{ matrix.configuration }} -Architecture x86_64 -Toolset default -CI
      - shell: pwsh
        run: ./Scripts/project.ps1 run -Generator vs2022 -Configuration ${{ matrix.configuration }} -Architecture x86_64 -Toolset default -CI
      - name: Verify commands did not change tracked state
        shell: pwsh
        run: if (git status --porcelain) { git status --short; throw 'Automation modified tracked state.' }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ matrix.configuration }}-failure
          path: |
            Logs/
            Build/Generated/
          if-no-files-found: ignore

  linux-x64:
    name: Linux x64 GCC ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist, DebugASan, DebugUBSan, DebugTSan]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            Tools/Linux
            Build/Dependencies
          key: linux-${{ runner.arch }}-gcc-dependencies-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Unix/dependencies.sh') }}
      - run: bash Scripts/project.sh bootstrap --generator ninja --architecture x86_64 --toolset default
      - run: bash Scripts/project.sh generate --generator ninja --architecture x86_64 --toolset default --ci
      - run: bash Scripts/project.sh test --generator ninja --configuration ${{ matrix.configuration }} --architecture x86_64 --toolset default --ci
      - run: bash Scripts/project.sh run --generator ninja --configuration ${{ matrix.configuration }} --architecture x86_64 --toolset default --ci
      - name: Verify commands did not change tracked state
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64-${{ matrix.configuration }}-failure
          path: |
            Logs/
            Build/Generated/
          if-no-files-found: ignore

  macos-intel:
    name: macOS Intel Clang ${{ matrix.configuration }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Dist, DebugASan, DebugUBSan, DebugTSan]
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            Tools/Mac
            Build/Dependencies
          key: macos-${{ runner.arch }}-clang-dependencies-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Unix/dependencies.sh') }}
      - run: bash Scripts/project.sh bootstrap --generator ninja --architecture x86_64 --toolset default
      - run: bash Scripts/project.sh generate --generator ninja --architecture x86_64 --toolset default --ci
      - run: bash Scripts/project.sh test --generator ninja --configuration ${{ matrix.configuration }} --architecture x86_64 --toolset default --ci
      - run: bash Scripts/project.sh run --generator ninja --configuration ${{ matrix.configuration }} --architecture x86_64 --toolset default --ci
      - name: Verify commands did not change tracked state
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-intel-${{ matrix.configuration }}-failure
          path: |
            Logs/
            Build/Generated/
          if-no-files-found: ignore

  arm64-smoke:
    name: ${{ matrix.name }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux ARM64, runner: ubuntu-24.04-arm, platform: Linux, configuration: Debug, toolset: gcc}
          - {name: Linux ARM64, runner: ubuntu-24.04-arm, platform: Linux, configuration: Release, toolset: gcc}
          - {name: macOS ARM64, runner: macos-15, platform: Mac, configuration: Debug, toolset: clang}
          - {name: macOS ARM64, runner: macos-15, platform: Mac, configuration: Release, toolset: clang}
          - {name: macOS ARM64, runner: macos-15, platform: Mac, configuration: DebugASan, toolset: clang}
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            Tools/${{ matrix.platform }}
            Build/Dependencies
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolset }}-dependencies-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Unix/dependencies.sh') }}
      - run: bash Scripts/project.sh bootstrap --generator ninja --architecture ARM64 --toolset default
      - run: bash Scripts/project.sh generate --generator ninja --architecture ARM64 --toolset default --ci
      - run: bash Scripts/project.sh test --generator ninja --configuration ${{ matrix.configuration }} --architecture ARM64 --toolset default --ci
      - run: bash Scripts/project.sh run --generator ninja --configuration ${{ matrix.configuration }} --architecture ARM64 --toolset default --ci
      - name: Verify commands did not change tracked state
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform }}-arm64-${{ matrix.configuration }}-failure
          path: |
            Logs/
            Build/Generated/
          if-no-files-found: ignore

  coverage:
    name: Linux Clang coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            Tools/Linux
            Build/Dependencies
          key: linux-${{ runner.arch }}-clang-dependencies-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Unix/dependencies.sh') }}
      - run: bash Scripts/project.sh coverage --generator ninja --architecture x86_64 --toolset clang --ci
      - run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-clang-coverage
          path: |
            Build/Coverage/linux-x86_64/coverage.info
            Build/Coverage/linux-x86_64/html/
          if-no-files-found: error

  quality:
    name: Format, lint, and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18 shellcheck yamllint
          python3 -m pip install --user ruff==0.12.5 PyYAML==6.0.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser"
      - name: Check C++ formatting
        run: |
          first_party=(AssetTool KeireAssetWorker KeireClient KeireCore KeireEditorTests KeireHub KeireRenderTests KeireRuntime KeireTests Examples Scripts/Premake SourceModules)
          find "${first_party[@]}" -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 clang-format-18 --dry-run --Werror
      - name: Check shell scripts
        run: shellcheck --exclude=SC2034 --source-path=SCRIPTDIR Scripts/project.sh Scripts/Tests/*.sh Scripts/Unix/*.sh Scripts/Linux/*.sh Scripts/Mac/*.sh
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path Scripts -Recurse -Settings PSScriptAnalyzerSettings.psd1 -Severity Warning,Error
          $issues | Format-Table
          if ($issues) { throw 'PSScriptAnalyzer reported issues.' }
      - name: Check Python helpers
        run: |
          python3 -m compileall -q Scripts
          ~/.local/bin/ruff check Scripts
          ~/.local/bin/ruff format --check Scripts
          python3 Scripts/Tests/check-text-integrity.py
          python3 Scripts/Tests/check-source-budgets.py
          python3 Scripts/Tests/validate-workflows.py
      - name: Check workflows and YAML
        run: |
          "$(go env GOPATH)/bin/actionlint"
          yamllint -c .yamllint.yml .github
      - name: Generate compile database
        run: bash Scripts/project.sh generate --generator compilecommands --architecture x86_64 --toolset clang --ci
      - name: Validate compile database coverage
        run: python3 Scripts/Tests/validate-compile-database.py
      - name: Run clang-tidy
        run: |
          first_party=(AssetTool KeireAssetWorker KeireClient KeireCore KeireEditorTests KeireHub KeireRenderTests KeireRuntime KeireTests Scripts/Premake SourceModules)
          find "${first_party[@]}" -type f -name '*.cpp' -print0 | xargs -0 clang-tidy-18 -p . --quiet
      - name: Verify quality commands did not change tracked state
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
