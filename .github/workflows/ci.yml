name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release, Dist, DebugASan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Bootstrap
        shell: pwsh
        run: .\Scripts\project.ps1 bootstrap -Generator vs2022

      - name: Generate
        shell: pwsh
        run: .\Scripts\project.ps1 generate -Generator vs2022

      - name: Build
        shell: pwsh
        run: .\Scripts\project.ps1 build -Generator vs2022 -Configuration ${{ matrix.configuration }}

      - name: Test
        shell: pwsh
        run: .\Scripts\project.ps1 test -Generator vs2022 -Configuration ${{ matrix.configuration }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.configuration }}-logs
          path: Logs/
          if-no-files-found: ignore

  linux:
    name: Linux ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release, Dist, DebugASan, DebugUBSan, DebugTSan ]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Bootstrap
        run: bash Scripts/project.sh bootstrap --generator ninja

      - name: Generate
        run: bash Scripts/project.sh generate --generator ninja

      - name: Build
        run: bash Scripts/project.sh build --generator ninja --configuration ${{ matrix.configuration }}

      - name: Test
        run: bash Scripts/project.sh test --generator ninja --configuration ${{ matrix.configuration }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.configuration }}-logs
          path: Logs/
          if-no-files-found: ignore

  macos:
    name: macOS ${{ matrix.configuration }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release, Dist, DebugASan, DebugUBSan, DebugTSan ]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Bootstrap
        run: bash Scripts/project.sh bootstrap --generator ninja

      - name: Generate
        run: bash Scripts/project.sh generate --generator ninja

      - name: Build
        run: bash Scripts/project.sh build --generator ninja --configuration ${{ matrix.configuration }}

      - name: Test
        run: bash Scripts/project.sh test --generator ninja --configuration ${{ matrix.configuration }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.configuration }}-logs
          path: Logs/
          if-no-files-found: ignore
