name: Reusable Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            Tools/Linux
            Build/Dependencies
          key: linux-${{ runner.arch }}-clang-dependencies-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Unix/dependencies.sh', 'Scripts/Unix/coral.sh', 'Scripts/Unix/shader-compiler.sh', 'Scripts/Dependencies/**') }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.1.14
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 shellcheck yamllint
          python3 -m pip install --user clang-format==22.1.8 ruff==0.12.5 PyYAML==6.0.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser"
      - name: Check C++ formatting
        run: |
          first_party=(AssetTool KeireAssetWorker KeireClient KeireCore KeireEditorTests KeireHub KeireHubPackagePublisher KeireHubRuntime KeireHubTests KeireHubWorker KeireRenderTests KeireRuntime KeireTests Examples Scripts/Premake SourceModules)
          find "${first_party[@]}" -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 |
            xargs -0 "$HOME/.local/bin/clang-format" --dry-run --Werror
      - name: Check shell scripts
        # Regression scripts intentionally grep shell source for literal $VARIABLE text.
        run: shellcheck --exclude=SC2034,SC2016 --source-path=SCRIPTDIR Scripts/project.sh Scripts/Tests/*.sh Scripts/Unix/*.sh Scripts/Linux/*.sh Scripts/Mac/*.sh
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path Scripts -Recurse -Settings PSScriptAnalyzerSettings.psd1 -Severity Warning,Error
          $issues | Format-Table
          if ($issues) { throw 'PSScriptAnalyzer reported issues.' }
      - name: Check Python helpers
        run: |
          python3 -m compileall -q Scripts
          ~/.local/bin/ruff check Scripts
          ~/.local/bin/ruff format --check Scripts
          python3 Scripts/Tests/check-text-integrity.py
          python3 Scripts/Tests/check-source-budgets.py
          python3 Scripts/Tests/validate-workflows.py
      - name: Check Supabase Edge Functions
        run: |
          functions=(
            website-contact marketplace-hub marketplace-library marketplace-moderation marketplace-publication
            marketplace-publication-queue marketplace-publisher marketplace-validator-queue
          )
          for function in "${functions[@]}"; do
            (cd "supabase/functions/$function" && deno check --frozen --lock=deno.lock index.ts)
          done
      - name: Check workflows and YAML
        run: |
          "$(go env GOPATH)/bin/actionlint"
          yamllint -c .yamllint.yml .github
      - name: Generate compile database
        run: bash Scripts/project.sh generate --generator compilecommands --architecture x86_64 --toolset clang --ci
      - name: Validate compile database coverage
        run: python3 Scripts/Tests/validate-compile-database.py
      - name: Run clang-tidy
        run: |
          first_party=(AssetTool KeireAssetWorker KeireClient KeireCore KeireEditorTests KeireHub KeireHubPackagePublisher KeireHubRuntime KeireHubTests KeireHubWorker KeireRenderTests KeireRuntime KeireTests Scripts/Premake SourceModules)
          find "${first_party[@]}" -type f -name '*.cpp' -print0 |
            xargs -0 -n 1 -P "$(nproc)" clang-tidy-18 -p . --quiet
      - name: Verify quality commands did not change tracked state
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
