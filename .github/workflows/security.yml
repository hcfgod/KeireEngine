name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - if: vars.ENABLE_ADVANCED_SECURITY != 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Advanced security checks are disabled

          Enable Dependency Graph and code scanning in the repository settings, set the repository variable
          `ENABLE_ADVANCED_SECURITY=true`, and add the resulting checks to the branch protection rules.
          EOF
      - if: vars.ENABLE_ADVANCED_SECURITY == 'true'
        run: echo 'Advanced security checks are enabled.' >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    if: vars.ENABLE_ADVANCED_SECURITY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: c-cpp
      - run: bash Scripts/project.sh build --generator ninja --configuration Debug --architecture x86_64 --toolset gcc --ci
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          output: codeql-results
          upload: always
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: ignore

  security-status:
    name: Security activation status
    if: always()
    needs: [configuration, dependency-review, codeql]
    runs-on: ubuntu-24.04
    env:
      ENABLED: ${{ vars.ENABLE_ADVANCED_SECURITY == 'true' }}
      EVENT_NAME: ${{ github.event_name }}
      FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
      CODEQL_RESULT: ${{ needs.codeql.result }}
    steps:
      - run: |
          if [ "$ENABLED" != true ]; then
            echo 'Advanced security is intentionally disabled.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$DEPENDENCY_REVIEW_RESULT" != success ]; then
            echo "Dependency Review did not succeed: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
          if [ "$FORK_PULL_REQUEST" != true ] && [ "$CODEQL_RESULT" != success ]; then
            echo "CodeQL did not succeed: $CODEQL_RESULT" >&2
            exit 1
          fi
          echo 'All eligible advanced-security jobs completed successfully.' >> "$GITHUB_STEP_SUMMARY"
