name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - if: vars.ENABLE_ADVANCED_SECURITY != 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Advanced security checks are disabled

          Enable Dependency Graph and code scanning in the repository settings, set the repository variable
          `ENABLE_ADVANCED_SECURITY=true`, and add the resulting checks to the branch protection rules.
          EOF
      - if: vars.ENABLE_ADVANCED_SECURITY == 'true'
        run: echo 'Advanced security checks are enabled.' >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    if: vars.ENABLE_ADVANCED_SECURITY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: c-cpp
      - run: bash Scripts/project.sh build --generator ninja --configuration Debug --architecture x86_64 --toolset gcc --ci
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          output: codeql-results
          upload: always
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: ignore
